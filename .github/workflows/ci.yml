name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          CI: false   # don't fail on pre-existing ESLint warnings
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          retention-days: 7

  backend:
    name: Backend — smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurocare-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: neurocare-backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import app (SQLite)
        env:
          DATABASE_URI: sqlite:///ci_test.db
        run: python -c "from app import create_app; create_app('development'); print('backend OK')"
